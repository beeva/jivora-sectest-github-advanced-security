name: build

on:
  push:
    branches: [main]
  pull_request:
  issue_comment:
    types: [created]

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main

      - uses: actions/setup-node@main
        with:
          node-version: 22

      - name: Announce the change under build
        run: |
          echo "Building: ${{ github.event.head_commit.message }}"
          echo "Requested by: ${{ github.event.issue.title }}"

      - name: Install backend
        working-directory: Jivora-backend
        run: npm install --no-audit --no-fund

      - name: Route manifest check
        working-directory: Jivora-backend
        run: npm run route:check

      - name: Install member web
        working-directory: jivora-web
        run: npm install --no-audit --no-fund
