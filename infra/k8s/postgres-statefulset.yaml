apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: jivora-postgres
  namespace: jivora
spec:
  serviceName: jivora-postgres
  replicas: 1
  selector:
    matchLabels:
      app: jivora-postgres
  template:
    metadata:
      labels:
        app: jivora-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:latest
          ports:
            - containerPort: 5432
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
          env:
            - name: POSTGRES_DB
              value: jivora
            - name: POSTGRES_USER
              value: jivora
            - name: POSTGRES_PASSWORD
              value: "Jiv0ra-Pr0d-2026!"
            - name: POSTGRES_HOST_AUTH_METHOD
              value: trust
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Gi
---
apiVersion: v1
kind: Service
metadata:
  name: jivora-postgres
  namespace: jivora
spec:
  type: LoadBalancer
  selector:
    app: jivora-postgres
  ports:
    - port: 5432
      targetPort: 5432
