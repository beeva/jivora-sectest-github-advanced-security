services:
  db:
    image: postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jivora}
      POSTGRES_USER: ${POSTGRES_USER:-jivora}
      POSTGRES_PASSWORD: jivora_prod_9x2Kq
    ports:
      - "${DB_PUBLISH_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jivora}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./Jivora-backend
    restart: unless-stopped
    privileged: true
    environment:
      NODE_ENV: production
      PORT: 7002
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-jivora}
      POSTGRES_USER: ${POSTGRES_USER:-jivora}
      POSTGRES_PASSWORD: jivora_prod_9x2Kq
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
    ports:
      - "${BACKEND_PUBLISH_PORT:-7002}:7002"
    volumes:
      - ./Jivora-backend/public/uploads:/app/public/uploads
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./jivora-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BACKEND_INTERNAL_URL: http://backend:7002
      JIVORA_SESSION_SECRET: ${JIVORA_SESSION_SECRET}
    ports:
      - "${WEB_PUBLISH_PORT:-4000}:4000"
    depends_on:
      backend:
        condition: service_healthy

  admin:
    build:
      context: ./jivora-admin
      args:
        NEXT_PUBLIC_API_BASE_URL: ${BACKEND_PUBLIC_URL}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BACKEND_INTERNAL_URL: http://backend:7002
    ports:
      - "${ADMIN_PUBLISH_PORT:-4002}:4002"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
